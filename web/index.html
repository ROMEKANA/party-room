<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f5f4ee">
<title>みんなでtier表</title>
<meta name="description" content="友だちと単語を出して、Tierやお題を予想したり、全員一致に挑戦したりするゲーム。">
<link rel="stylesheet" href="./style.css"></head>
<body><main class="app">
  <header>
    <div class="brand">みんなでtier表 <button id="brand-version" class="brand-version" type="button" aria-label="ver1.2.0のアップデート履歴を開く" aria-haspopup="dialog">ver1.2.0</button></div>
    <button id="release-history" class="control" type="button" aria-haspopup="dialog">アップデート履歴</button>
    <nav id="nav" aria-label="ゲームのメニュー" hidden>
      <button id="roundHistory">履歴</button><button id="rules">ルール</button><button id="settings">設定</button><button id="menu">メニュー</button>
    </nav>
  </header>
  <section id="entrance" class="entrance">
    <form id="join" class="entry-card">
      <h1>Tier表予想ゲーム</h1>
      <label>名前<input id="name" maxlength="40" autocomplete="nickname" required placeholder="20文字まで"></label>
      <button class="primary">ルームに参加</button>
      <p id="join-error" class="error" role="alert"></p>
    </form>
  </section>
  <section id="players" class="players" aria-label="プレイヤー" hidden></section>
  <section id="intro" class="intro" hidden>
    <div class="title-line"><h1 id="board-title"></h1><span id="life" class="pill"></span></div>
    <div class="subline"><span id="phase-label"></span><span id="progress"></span></div>
    <div class="progress-track"><div id="progress-bar"></div></div>
  </section>
  <section id="board" class="board" aria-label="ティア表" hidden></section>
  <section id="deck" class="deck" aria-label="現在の操作" hidden>
    <div class="deck-top" id="deck-label"></div>
    <div id="current" class="current"></div>
    <div id="choices" class="choices" aria-label="Tierを選択"></div>
  </section>
  <p id="notice" class="notice" role="status" hidden></p>
</main>
<section id="submission-wait" class="submission-wait" aria-labelledby="wait-title" hidden>
  <div class="wait-content">
    <h2 id="wait-title" tabindex="-1">提出完了</h2>
    <p>ほかのプレイヤーを待っています</p>
    <section id="wait-players" class="players" aria-label="提出状況"></section>
    <button id="wait-end" class="control" type="button" hidden>途中終了</button>
  </div>
</section>
<section id="overlay" class="overlay" hidden>
  <div id="dialog" class="dialog" role="dialog" aria-labelledby="dialog-title"></div>
  <button id="peek-board" class="control peek-board" type="button" hidden>tier表を確認する</button>
</section>
<script type="module" src="./app.js"></script></body></html>

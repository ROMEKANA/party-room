<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f5f4ee">
<title>いつでもパーティールーム</title>
<meta name="description" content="みんなでtier表、Circle & Cross、名前の知らないあのゲームを友だちと遊べるオンラインゲーム。">
<meta name="application-name" content="いつパ">
<meta name="apple-mobile-web-app-title" content="いつパ">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
<link rel="icon" href="./favicon.png" type="image/png" sizes="32x32">
<link rel="stylesheet" href="./style.css"></head>
<body><main class="app">
  <header>
    <div class="brand">いつでもパーティールーム <button id="brand-version" class="brand-version" type="button" aria-label="アップデート情報を開く" aria-haspopup="dialog"></button></div>
    <button id="release-history" class="control" type="button" aria-haspopup="dialog">アップデート情報</button>
    <nav id="nav" aria-label="ゲームのメニュー" hidden>
      <button id="roundHistory">履歴</button><button id="rules">ルール</button><button id="settings">設定</button><button id="menu">メニュー</button>
    </nav>
  </header>
  <section id="entrance" class="entrance">
    <form id="join" class="entry-card" novalidate>
      <h1>いつでもパーティールーム</h1>
      <label>名前<input id="name" autocomplete="nickname" required placeholder="8文字まで" aria-describedby="join-error"></label>
      <fieldset id="avatar-fieldset">
        <legend>プレイヤーアイコン</legend>
        <div id="avatar-picker" class="avatar-picker"></div>
      </fieldset>
      <button type="submit" class="primary">ルームに参加</button>
      <p id="join-error" class="error" role="alert"></p>
    </form>
  </section>
  <section id="players" class="players" aria-label="プレイヤー" hidden></section>
  <section id="party" class="party-screen" hidden></section>
  <section id="intro" class="intro" hidden>
    <div class="title-line"><h1 id="board-title"></h1><span id="life" class="pill"></span></div>
    <div class="subline"><span id="phase-label"></span><span id="progress"></span></div>
    <div class="progress-track"><div id="progress-bar"></div></div>
  </section>
  <section id="board" class="board" aria-label="ティア表" hidden></section>
  <section id="deck" class="deck" aria-label="現在の操作" hidden>
    <div class="deck-top" id="deck-label"></div>
    <div id="current" class="current"></div>
    <div id="choices" class="choices" aria-label="Tierを選択"></div>
  </section>
  <p id="notice" class="notice" role="status" hidden></p>
</main>
<section id="overlay" class="overlay" hidden>
  <div id="dialog" class="dialog" role="dialog" aria-labelledby="dialog-title"></div>
  <button id="peek-board" class="control peek-board" type="button" hidden>Tier表を確認する</button>
</section>
<dialog id="update-overlay" class="update-dialog" aria-labelledby="update-title">
  <h2 id="update-title">アプリの更新があります</h2>
  <p id="update-version"></p>
  <p id="update-reconnect">更新後、自動的にルームへ再接続します。</p>
  <button id="update-now" class="primary" type="button">アプリを更新する</button>
</dialog>
<script type="module" src="./app.js"></script></body></html>

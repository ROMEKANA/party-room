<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f4ee"><title>Tier Studio — 好きを、並べよう。</title><meta name="description" content="1枚ずつカードを選んで、自分だけのティア表を作る。"><link rel="stylesheet" href="./style.css"></head><body><main class="app"><header><a class="brand" href="./"><span class="brand-icon">▥</span> tier<span>studio</span><i>●</i></a><button class="icon-button" id="settings" aria-label="カードを編集">☷</button></header><section class="intro"><div class="eyebrow">YOUR PICKS. YOUR RULES.</div><div class="title-line"><h1 id="board-title">好きな食べもの</h1><span class="pill">MY TIER LIST</span></div><div class="subline"><p>好きの順番、直感で。</p><span id="progress">0 / 12</span></div><div class="progress-track"><div id="progress-bar"></div></div></section><section id="board" class="board" aria-label="ティア表"></section><section class="deck" aria-label="次のカード"><div class="deck-top"><span id="deck-label">このカードは、どのティア？</span><button id="undo" class="text-button">↶ 戻す</button></div><div id="current" class="current"></div><div id="choices" class="choices" aria-label="配置するティアを選択"></div><p class="hint" id="hint">下のランクをタップして配置</p></section><footer><span><i></i> この端末に自動保存</span><button id="reset" class="text-button">最初から ↺</button></footer></main><dialog id="editor"><form method="dialog"><div class="modal-head"><h2>自分のカードで作る</h2><button class="icon-button" aria-label="閉じる">×</button></div><label>ティア表のタイトル<input id="title-input" maxlength="32" required></label><label>カード名 <small>1行に1枚・最大30枚</small><textarea id="cards-input" rows="7" required></textarea></label><p class="modal-note">変更すると、今の配置はリセットされます。</p><button type="button" id="apply" class="primary">このカードで始める</button><p id="error" role="alert"></p></form></dialog><div id="announcement" class="sr-only" aria-live="polite"></div><script type="module" src="./app.js"></script></body></html>
